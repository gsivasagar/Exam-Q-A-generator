services:
  app:
    build: .
    container_name: exam-qa-generator
    ports:
      - "8501:8501"
    volumes:
      # Persist only app data (vector store + results DB), not the whole repo
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      # Connect to host's Ollama instance
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=gemma3:latest # Uncomment to override model
    extra_hosts:
      # Lets Linux resolve host.docker.internal (harmless on Mac/Windows)
      - "host.docker.internal:host-gateway"
